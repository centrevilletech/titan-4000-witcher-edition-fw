[workspace]
members = ["pd-model", "pd-keeper", "firstboot", "sys", "tk-patch", "tk-patch-cli"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The modem image codec runs over whole 9.5 MB images in tests.
[profile.dev.package.witcher-tk-patch]
opt-level = 3

[profile.dev.package.witcher-tk-patch-cli]
opt-level = 3
