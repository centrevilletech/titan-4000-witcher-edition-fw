[package]
name = "witcher-tk-patch-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Host tool: turn tkpatch.py specs into Witcher tk patch manifests and build images from them"

[[bin]]
name = "tk-patch"
path = "src/main.rs"

[dependencies]
witcher-tk-patch = { path = "../tk-patch" }
serde_json = "1"
